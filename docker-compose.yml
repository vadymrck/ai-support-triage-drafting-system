services:
  api:
    build: .
    env_file: .env
    environment:
      PYTHONPATH: /app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: support_triage
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_triage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
